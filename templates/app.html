<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="tasalo-base" content="{{ base_path }}">
  <meta name="tasalo-bot" content="{{ bot_username }}">
  <meta name="tasalo-version" content="{{ app_version }}">
  <title>TASALO</title>
  <link rel="stylesheet" href="{{ asset('css/tokens.css') }}">
  <link rel="stylesheet" href="{{ asset('css/shell.css') }}">
  <link rel="stylesheet" href="{{ asset('css/components.css') }}">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="module" src="{{ asset('js/main.js') }}"></script>
</head>
<body>
  <div class="app" id="app">

    <div class="banner" id="banner-offline" role="status" hidden>Sin conexión. Mostrando lo último guardado.</div>

    <section class="state" id="state-loading" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p class="state-text">Cargando…</p>
    </section>

    <section class="state" id="state-unidentified" hidden>
      <svg class="state-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <h1 class="state-title">Ábrela desde @{{ bot_username }}</h1>
      <p class="state-text">Esta app solo funciona dentro de Telegram.</p>
      <a class="btn" id="open-bot" href="https://t.me/{{ bot_username }}" rel="noopener noreferrer">Abrir el bot</a>
    </section>

    <section class="state" id="state-error" hidden>
      <svg class="state-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      <h1 class="state-title">No pudimos cargar</h1>
      <p class="state-text" id="error-text">Algo falló al conectar. Inténtalo de nuevo.</p>
      <button class="btn" id="retry" type="button">Reintentar</button>
    </section>

    <div class="shell" id="shell" hidden>
      <header class="hd">
        <div>
          <h1 class="hd-title" id="view-title">Tasas</h1>
          <div class="sub" id="view-subtitle"></div>
        </div>
        <div class="hd-actions" id="view-actions"></div>
      </header>

      <main class="view" id="view" tabindex="-1"></main>

      <nav class="nav" aria-label="Secciones">
        <a class="nv" href="#/tasas" data-tab="tasas">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
          <span>Tasas</span>
        </a>
        <a class="nv" href="#/mercado" data-tab="mercado">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="9" width="5" height="8" rx="1.5"/><path d="M6.5 5v4M6.5 17v3"/><rect x="15" y="6" width="5" height="9" rx="1.5"/><path d="M17.5 3v3M17.5 15v4"/></svg>
          <span>Mercado</span>
        </a>
        <a class="nv" href="#/calculadora" data-tab="calculadora">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg>
          <span>Calculadora</span>
        </a>
        <a class="nv" href="#/blog" data-tab="blog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M9 9h5M9 13h5"/></svg>
          <span>Blog</span>
        </a>
        <a class="nv" href="#/perfil" data-tab="perfil">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/></svg>
          <span>Perfil</span>
        </a>
      </nav>
    </div>

  </div>
</body>
</html>
